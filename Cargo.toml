[package]
name = "wav2midi"
version = "0.1.0"
edition = "2024"

[dependencies]
midly = "0.5.3"
hound = "3.5.1"
rustfft = "6.4.1"
realfft = "3.5.1"
num-complex = "0.4.6"
symphonia = { version = "0.6.1", features = ["wav"] }
rubato = "5.0.1"
rfd = "0.17.2"
indicatif = "0.18.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
