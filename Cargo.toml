[package]
name = "wav2midi"
version = "6.0.4"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
indicatif = "0.18.6"
midly = "0.5.3"
num-complex = "0.4.6"
realfft = "3.5.1"
rfd = "0.17.2"
rubato = "5.0.1"
rustfft = "6.4.1"
symphonia = { version = "0.6.1", features = ["wav"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
